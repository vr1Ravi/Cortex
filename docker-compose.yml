services:
  db:
    image: postgres:16
    container_name: cortex-postgres
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"          # host:container — reachable at localhost:5432
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data   # data survives container restarts

volumes:
  cortex_pgdata:
