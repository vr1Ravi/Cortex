services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cortex-postgres
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
    healthcheck: # "is Postgres actually ready?"
      test: ["CMD-SHELL", "pg_isready -U cortex"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: cortex-redis
    ports:
      - "6379:6379"

  api:
    build: . # build from your Dockerfile
    container_name: cortex-api
    env_file: .env # load your secrets (GOOGLE_API_KEY, etc.)
    environment: # override host-specific URLs → service names
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@db:5432/cortex
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # wait until DB passes healthcheck
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker: # Celery worker = same image, different command
    build: .
    container_name: cortex-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cortex:cortex@db:5432/cortex
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.worker.celery_app worker --loglevel=info

volumes:
  cortex_pgdata:
